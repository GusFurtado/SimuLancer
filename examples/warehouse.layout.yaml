# Visual layout for warehouse.yaml (meters, Y up). Receiving and restocking
# on the top side, orders on the bottom. The racks, shelves and order backlog
# (queues) and the forklifts' transport are drawn straight between their objects.
model: warehouse.yaml
units: m

objects:
  trucks:       { position: [0, 0, -5], model: dock }
  unload:       { position: [8, 0, -5], model: workstation }
  putaway:      { position: [16, 0, -5], model: workstation }
  break_pallet: { position: [24, 0, -5], model: workstation }
  orders:       { position: [0, 0, 5], model: generic }
  pick:         { position: [32, 0, 0], model: workstation }
  pack:         { position: [40, 0, 0], model: workstation }
  dispatch:     { position: [48, 0, 0], model: dock }

conveyors:
  dock:        { path: [[0.7, 0, -5], [7.3, 0, -5]] }      # 6.6
  to_pack:     { path: [[32.7, 0, 0], [39.3, 0, 0]] }      # 6.6
  to_dispatch: { path: [[40.7, 0, 0], [47.3, 0, 0]] }      # 6.6

vehicles:
  forklifts: { model: forklift }

entities:
  pallet: { model: pallet }
