# Visual layout for warehouse.yaml (meters, Y up). Receiving and restocking
# on the top side, orders on the bottom. The racks, shelves and order backlog
# (queues) and the forklifts' transport are drawn straight between their objects.
model: warehouse.yaml
units: m

objects:
  trucks:       { position: [0, 0, -5], model: dock }
  unload:       { position: [9.75, 0, -5], model: workstation }    # 2 units
  putaway:      { position: [21, 0, -5], model: workstation }      # 3 units
  break_pallet: { position: [33, 0, -5], model: workstation }
  orders:       { position: [0, 0, 5], model: generic }
  pick:         { position: [40, 0, 0], model: workstation }       # 8 units, two rows
  pack:         { position: [54.3, 0, 0], model: workstation }     # 2 units
  dispatch:     { position: [64, 0, 0], model: dock }

conveyors:
  dock:        { path: [[0.7, 0, -5], [7.3, 0, -5]] }      # 6.6
  to_pack:     { path: [[45.3, 0, 0], [51.9, 0, 0]] }      # 6.6
  to_dispatch: { path: [[56.7, 0, 0], [63.3, 0, 0]] }      # 6.6

vehicles:
  forklifts: { model: forklift }

entities:
  pallet: { model: pallet }
