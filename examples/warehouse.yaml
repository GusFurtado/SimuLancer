# Distribution warehouse: when the pallets in the racks (with those on the
# way) fall to 250, a truck of 25 is ordered; it comes a day or so later, on
# the morning shift, and forklifts put the pallets away in the racks.
# Pallets are broken into cartons onto the pick shelves as they have room.
# Customer orders come in all day; pickers fill each order with two cartons,
# then it's packed and dispatched.
#
#   trucks ─ dock ─> unload ─> putaway ─ racks ─> break_pallet ─ shelves ─┐
#   (25 pallets)   (2 doors) (forklifts)         (1 pallet: 10 cartons)  ├─> pick ─> pack ─> dispatch
#   orders ─────────────────────────── backlog ──────────────────────────┘  (pickers)
#
# The racks, the shelves and the order backlog are queues. Pallets come off
# the racks only when the shelves have room, so the shelves restock
# themselves; trucks restock the racks. Forklift trips are part of
# putaway's time, one pallet a trip.

format: outliers-sim/0.1
name: warehouse
description: Trucks of pallets put away by forklifts, broken into cartons on the pick shelves; orders picked, packed and dispatched.

entities:
  pallet: {}
  carton: {}
  order: {}
  shipment: {}     # an order with its cartons

schedules:
  receiving:
    shifts: ["06:00-14:00"]
    days: [mon, tue, wed, thu, fri]
  operations:
    shifts: ["06:00-14:00", "14:00-22:00"]
    days: [mon, tue, wed, thu, fri]

resources:
  forklift: { capacity: 3, schedule: operations }
  picker: { capacity: 5, schedule: operations }

sources:
  trucks:
    creates: pallet
    restocks: racks                          # keeps the racks stocked:
    reorder_point: 250                       #   order when they (and what's coming) fall to 250 pallets
    order: 25                                #   a truck of 25 pallets
    lead_time: "uniform(18 h, 30 h)"         #   which comes a day or so later
    schedule: receiving                      #   (deliveries only on the morning shift)
  orders:
    creates: order
    interarrival: "exponential(90 s)"
    schedule: operations

servers:
  unload:
    capacity: 2                              # two dock doors
    process_time: "uniform(1 min, 2 min)"    # a pallet
  putaway:
    capacity: 3                              # forklifts are the limit
    process_time: "triangular(2 min, 3 min, 6 min)"   # to the racks and back
    needs: { forklift: 1 }
  break_pallet:
    process_time: "4 min"
    splits_into: { carton: 10 }
    schedule: operations
  pick:
    capacity: 8                              # pick stations; pickers are the limit
    assembles: { order: 1, carton: 2 }
    makes: shipment
    keeps_clock_of: order                    # a shipment's time counts from its order
    process_time: "triangular(2 min, 3 min, 6 min)"
    needs: { picker: 1 }
    input: { rule: first_come }
  pack:
    capacity: 2
    process_time: "uniform(1 min, 2 min)"
    schedule: operations

conveyors:
  dock:        { from: trucks,  to: unload,   length: "6.6 m", speed: "0.5 m/s", spacing: "1 m" }
  to_putaway:  { from: unload,  to: putaway,  length: "6.6 m", speed: "0.5 m/s", spacing: "1 m" }
  to_pack:     { from: pick,    to: pack,     length: "6.6 m", speed: "0.5 m/s", spacing: "1 m" }
  to_dispatch: { from: pack,    to: dispatch, length: "6.6 m", speed: "0.5 m/s", spacing: "1 m" }

queues:
  racks:   { from: putaway,      to: break_pallet, capacity: 300, starts_with: 150 }   # pallet positions
  shelves: { from: break_pallet, to: pick,         capacity: 400, starts_with: 200 }   # cartons on the pick face
  backlog: { from: orders,       to: pick }

sinks:
  dispatch: {}

experiment:
  replications: 20
  warmup: "7 d"
  run_length: "28 d"
  seed: 20261021

outputs:
  event_log: jsonl
  throughput_per: operations           # per working hour of operations
