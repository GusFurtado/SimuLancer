# The project file of the warehouse example, as `outliers-sim serve`
# creates it: which file is the model, and what the Simulation page lets
# people change and read.

format: outliers-sim-project/0.1
name: Distribution warehouse
description: Trucks of pallets put away by forklifts, broken into cartons on the pick shelves; orders picked, packed and dispatched.
model: model.yaml

# What can be changed on the Simulation page.
decisions:
  reorder_point:
    label: Reorder point (pallets)
    description: A truck is ordered when the pallets in the racks, with those on the way, fall to this. Higher holds more stock; lower risks running out.
    path: sources.trucks.reorder_point
    min: 100
    max: 300
    step: 25
  forklifts:
    label: Forklifts
    path: vehicles.forklifts.count
    min: 1
    max: 4
  pickers:
    label: Pickers per shift
    path: resources.picker.capacity
    min: 2
    max: 8
  pack_stations:
    label: Packing stations
    path: servers.pack.capacity
    min: 1
    max: 4

# What the Simulation page shows, and which way is better.
results:
  - { label: Orders dispatched per working hour, object: dispatch, measure: throughput, better: higher }
  - { label: Order lead time (order to dispatch), object: dispatch, measure: time in system, better: lower }
  - { label: Wait before an order is picked, object: backlog, measure: waiting time, better: lower }
  - { label: Pallets in the racks, object: racks, measure: mean parts, better: lower }
  - { label: Time the racks are empty, object: racks, measure: empty, better: lower }
  - { label: Trucks kept waiting at the dock, object: trucks, measure: blocked, better: lower }
  - { label: Pickers busy, object: picker, measure: busy }
  - { label: Forklifts busy, object: forklifts, measure: busy }
  - { label: Wait for a forklift, object: to_racks, measure: waiting for pickup, better: lower }
