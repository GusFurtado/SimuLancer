# The project file of the bike-assembly example, as `outliers-sim serve`
# creates it: which file is the model, and what the Simulation page lets people
# change and read.

format: outliers-sim-project/0.1
name: Bike assembly
description: Frames and wheels assembled into bikes by fitters on two shifts, then cured in a batch oven.
model: model.yaml

# What can be changed on the Simulation page.
decisions:
  fitters:
    label: Fitters per shift
    description: People assembling bikes; each works on one bike at a time.
    path: resources.fitter.capacity
    min: 1
    max: 4
  shifts:
    label: Working hours
    choices:
      two:
        label: Two shifts, weekdays 06:00 to 22:00
      three:
        label: Add a night shift (around the clock on weekdays)
        changes: { schedules.two_shifts.shifts: ["06:00-14:00", "14:00-22:00", "22:00-06:00"] }
  oven_batch:
    label: Bikes cured together in the oven
    path: servers.oven.batch
    min: 4
    max: 12
    step: 2

# What the Simulation page shows, and which way is better.
results:
  - { label: Bikes shipped per working hour, object: shipping, measure: throughput, better: higher }
  - { label: Lead time, object: shipping, measure: time in system, better: lower }
  - { label: Fitters busy, object: fitter, measure: busy }
  - { label: Kits waiting for a fitter, object: assembly, measure: waiting for resources, better: lower }
