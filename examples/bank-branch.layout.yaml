# Visual layout for bank-branch.yaml (meters, Y up). The kiosk is by the
# door; tellers' counters on one side, advisors' desks on the other. The
# queues are drawn straight between them.
model: bank-branch.yaml
units: m

objects:
  door:     { position: [0, 0, 0], model: door }
  kiosk:    { position: [5, 0, 0], model: kiosk }
  tellers:  { position: [12, 0, -5.5], model: counter }    # 5 counters, two rows
  advisors: { position: [12, 0, 4.5], model: counter }     # 3 desks
  exit:     { position: [18, 0, 0], model: door }

entities:
  quick:    { model: person }
  priority: { model: person }
  advice:   { model: person }

# Tellers wait in the back office, advisors by the desks; each walks to the
# counter or desk where a customer is served.
resources:
  teller:  { position: [12, 0, -10], model: clerk }
  advisor: { position: [6, 0, 6.5], model: clerk }
