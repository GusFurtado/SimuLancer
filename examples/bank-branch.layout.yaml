# Visual layout for bank-branch.yaml (meters, Y up). The kiosk is by the
# door; tellers' counters on one side, advisors' desks on the other. The
# queues are drawn straight between them.
model: bank-branch.yaml
units: m

objects:
  door:     { position: [0, 0, 0] }
  kiosk:    { position: [5, 0, 0], model: machine_small }
  tellers:  { position: [12, 0, -4], model: machine_small }
  advisors: { position: [12, 0, 4], model: machine_small }
  exit:     { position: [18, 0, 0] }
