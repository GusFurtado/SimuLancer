name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Validate example models
        run: |
          for model in examples/*.yaml; do
            case "$model" in *.layout.yaml) continue ;; esac
            cargo run -q -- validate "$model"
          done

  viewer:
    runs-on: ubuntu-latest
    env:
      # Same version as the tablet's Godot Editor app; keep in sync with
      # viewer/project.godot (config/features).
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Godot
        run: |
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -sSfL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/${name}" >> "$GITHUB_ENV"
      - name: Viewer checks
        run: viewer/tests/run_all.sh

  web-ui:
    # Drives the web interface in a real (headless) Firefox and keeps the
    # screenshots as an artifact, so the UI can be reviewed from GitHub.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Browser test
        run: SHOTS="$PWD/ui-screenshots" tests/ui/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-screenshots

  docker:
    # The image IT deploys: build it, start it, check it answers, stop it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t outliers-sim:ci .
      - name: Start, check health and a run, stop
        run: |
          docker run -d --name sim -p 127.0.0.1:8080:8080 outliers-sim:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/api/v1/health && break; sleep 1; done
          id=$(curl -sf -X POST localhost:8080/api/v1/runs -H 'content-type: application/json' \
            -d '{"file": "two-cells.yaml", "replications": 3}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for i in $(seq 1 60); do
            status=$(curl -sf localhost:8080/api/v1/runs/$id | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            [ "$status" = done ] && break
            [ "$status" = failed ] && exit 1
            sleep 1
          done
          [ "$status" = done ]
          time docker stop sim
          docker logs sim

