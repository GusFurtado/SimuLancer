name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Validate example models
        run: |
          for model in examples/*.yaml; do
            case "$model" in *.layout.yaml|*/templates.yaml) continue ;; esac
            cargo run -q -- validate "$model"
          done
      - name: Test example models (their expected results)
        run: |
          models=()
          for model in examples/*.yaml; do
            case "$model" in *.layout.yaml|*/templates.yaml) continue ;; esac
            models+=("$model")
          done
          cargo run -q --release -- test "${models[@]}" --output-dir "$RUNNER_TEMP/test-results"

  web-ui:
    # Checks the animation's replay against the engine, then drives the web
    # interface in a real (headless) Firefox, and keeps the
    # screenshots as an artifact, so the UI can be reviewed from GitHub.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Browser test
        run: SHOTS="$PWD/ui-screenshots" tests/ui/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-screenshots

  docker:
    # The image IT deploys: build it, start it, check it answers, stop it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t simulancer:ci .
      - name: Start, check health and a run, stop
        run: |
          docker run -d --name sim -p 127.0.0.1:8080:8080 simulancer:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/api/v1/health && break; sleep 1; done
          # A new data folder has no projects: start one from a template.
          curl -sf -X POST localhost:8080/api/v1/projects -H 'content-type: application/json' \
            -d '{"id": "two-cells", "template": "two-cells"}'
          id=$(curl -sf -X POST localhost:8080/api/v1/runs -H 'content-type: application/json' \
            -d '{"project": "two-cells", "version": "latest", "replications": 3}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for i in $(seq 1 60); do
            status=$(curl -sf localhost:8080/api/v1/runs/$id | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            [ "$status" = done ] && break
            [ "$status" = failed ] && exit 1
            sleep 1
          done
          [ "$status" = done ]
          time docker stop sim
          docker logs sim

