[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GusFurtado/simulancer"

# Release builds are what ship: no debug symbols, cross-crate optimization.
[profile.release]
strip = true
lto = "thin"

# The engine's statistical tests simulate millions of parts; optimize it even
# in debug builds so `cargo test` stays fast.
[profile.dev.package.simulancer-engine]
opt-level = 3

# Writing and reading Parquet is slow unoptimized; the tests do both.
[profile.dev.package.parquet]
opt-level = 3
[profile.dev.package.snap]
opt-level = 3

[workspace.dependencies]
simulancer-engine = { path = "crates/engine" }
simulancer-model = { path = "crates/model" }
