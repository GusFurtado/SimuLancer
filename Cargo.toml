[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GusFurtado/outliers-sim"

# The engine's statistical tests simulate millions of parts; optimize it even
# in debug builds so `cargo test` stays fast.
[profile.dev.package.outliers-sim-engine]
opt-level = 3

[workspace.dependencies]
outliers-sim-engine = { path = "crates/engine" }
outliers-sim-model = { path = "crates/model" }
