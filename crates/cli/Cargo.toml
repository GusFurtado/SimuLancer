[package]
name = "simulancer"
description = "Command-line interface for simulancer: validate and run discrete event simulation models."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "simulancer"
path = "src/main.rs"

[dependencies]
simulancer-engine.workspace = true
simulancer-model.workspace = true
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["compression-gzip"] }
serde-saphyr = "1.3.0"
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
parquet = { version = "60", default-features = false, features = ["snap"] }
bytes = "1"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
