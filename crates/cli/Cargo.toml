[package]
name = "outliers-sim"
description = "Command-line interface for outliers-sim: validate and run discrete event simulation models."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "outliers-sim"
path = "src/main.rs"

[dependencies]
outliers-sim-engine.workspace = true
outliers-sim-model.workspace = true
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["compression-gzip"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
