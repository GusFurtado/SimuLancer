<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modeling · SimuLancer</title>
<meta name="theme-color" content="#f9f9f7">
<link rel="stylesheet" href="common.css">
<script src="theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="back" href="./"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>Projects</a>
    <b id="project-name"></b>
    <nav class="pages">
      <a class="current" id="to-modeling">Modeling</a>
      <a id="to-simulation">Simulation</a>
    </nav>
    <button type="button" class="theme-btn" data-theme-picker title="Theme" aria-label="Theme" aria-haspopup="dialog" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="13.5" cy="6.5" r="1.2"/><circle cx="17.5" cy="10.5" r="1.2"/><circle cx="8.5" cy="7.5" r="1.2"/><circle cx="6.5" cy="12.5" r="1.2"/><path d="M12 2a10 10 0 0 0 0 20 1.7 1.7 0 0 0 1.7-1.7c0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1a1.7 1.7 0 0 1 1.7-1.7h2A5.6 5.6 0 0 0 22 10.8C22 5.9 17.5 2 12 2z"/></svg></button>
  </header>
  <div class="app activity-app">
    <!-- Like an editor's activity bar: each icon opens its panel; clicking it again closes it. -->
    <nav class="activity" aria-label="Side panels">
      <button id="show-components" data-side="components" title="Components" aria-label="Components" aria-controls="side">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 14v7M14 17.5h7"/></svg>
      </button>
      <button id="show-definitions" data-side="definitions" title="Definitions" aria-label="Definitions" aria-controls="side">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h2M4 12h2M4 18h2M9 6h11M9 12h11M9 18h11"/></svg>
      </button>
      <button id="show-runs" data-side="runs" title="Recent runs" aria-label="Recent runs" aria-controls="side">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 4v4h4"/><path d="M12 7.5V12l3 2"/></svg>
      </button>
    </nav>
    <aside id="side" hidden>
      <section id="side-components" hidden></section>
      <section id="side-definitions" hidden></section>
      <section id="side-runs" hidden>
        <h2>Recent runs</h2>
        <div class="list" id="runs"></div>
      </section>
    </aside>
    <main id="main"></main>
  </div>
</div>
<script src="art.js"></script>
<script src="common.js"></script>
<script src="modeling.js"></script>
</body>
</html>
