# Example nginx site in front of SimuLancer: HTTPS and logins live here,
# not in the simulator. See docs/deploy.md.

server {
    listen 443 ssl;
    server_name simulator.example.com;

    ssl_certificate     /etc/ssl/certs/simulator.example.com.pem;
    ssl_certificate_key /etc/ssl/private/simulator.example.com.key;

    # Authentication: use your SSO, or at least basic auth:
    #   sudo htpasswd -c /etc/nginx/simulancer.htpasswd alice
    auth_basic           "SimuLancer";
    auth_basic_user_file /etc/nginx/simulancer.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }

    # To serve it under a path instead (https://intranet.example.com/simulator/),
    # the web interface uses relative URLs, so this works as is:
    #   location /simulator/ { proxy_pass http://127.0.0.1:8080/; }
}
